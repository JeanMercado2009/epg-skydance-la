name: Actualizacion EPG Discovery EPAK

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:

concurrency:
  group: epg-discovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-discovery-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade pip
          pip install requests pandas xlrd openpyxl beautifulsoup4 html5lib lxml

      - name: Descargar y Procesar Grillas Discovery
        env:
          TAPKIT_EMAIL: ${{ secrets.TAPKIT_EMAIL }}
          TAPKIT_PASSWORD: ${{ secrets.TAPKIT_PASSWORD }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python updater_discovery.py

      - name: Guardar cambios de Discovery en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add DKLA_EPG.xml DHH_LA.xml
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en DKLA_EPG.xml ni en DHH_LA.xml."
          else
            git commit -m "Auto-update EPG Discovery Kids & Home & Health"
            git pull --rebase origin main
            git push
          fi
