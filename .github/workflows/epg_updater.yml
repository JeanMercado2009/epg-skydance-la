name: Actualización Diaria EPG WB Skydance

on:
  schedule:
    # 19:30 COT (UTC-5) = 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # ENTORNOS DE LENGUAJES (Python, Node.js/TS, Go, Rust)
      # ---------------------------------------------------------
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Node.js y TypeScript
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      # ---------------------------------------------------------
      # INSTALACIÓN DE DEPENDENCIAS
      # ---------------------------------------------------------
      - name: Instalar dependencias de Python
        run: |
          pip install requests pandas xlrd openpyxl beautifulsoup4 html5lib

      - name: Instalar dependencias de Node.js y TypeScript
        run: |
          npm install axios xlsx xml2js typescript ts-node

      # ---------------------------------------------------------
      # EJECUCIÓN DEL SCRIPT
      # ---------------------------------------------------------
      - name: Descargar y Procesar Grillas Diarias, Mensuales y TVEGO
        env:
          TAPKIT_EMAIL: ${{ secrets.TAPKIT_EMAIL }}
          TAPKIT_PASSWORD: ${{ secrets.TAPKIT_PASSWORD }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # Script actual en ejecución:
          python updater.py

          # Opciones para alternar de lenguaje en el futuro:
          # node updater.js
          # npx ts-node updater.ts
          # go run updater.go
          # cargo run --release

      # ---------------------------------------------------------
      # GUARDAR CAMBIOS EN GITHUB
      # ---------------------------------------------------------
      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CNLA_EPG.xml WARNERLA_EPG.xml TNTLA_EPG.xml DKLA_EPG.xml
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en las grillas."
          else
            git commit -m "Auto-update EPG WB Skydance + Discovery Kids: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
