name: Actualizacion EPG WB

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: epg-wb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          pip install requests pandas xlrd openpyxl beautifulsoup4 html5lib lxml

      - name: Descargar y Procesar Grillas WB
        env:
          TAPKIT_EMAIL: ${{ secrets.TAPKIT_EMAIL }}
          TAPKIT_PASSWORD: ${{ secrets.TAPKIT_PASSWORD }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python updater.py

      - name: Guardar cambios de WB en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CTOOLA_EPG.xml CNLA_EPG.xml WARNERLA_EPG.xml TNTLA_EPG.xml HBO_EPG.xml TOONCAST_EPG.xml TNT_SPORTS.xml
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en las grillas WB."
          else
            git commit -m "Auto-update EPG WB"
            git pull --rebase origin main
            git push
          fi
