name: Actualizacion Diaria EPG WB Skydance y Discovery

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias de Python
        run: |
          pip install requests pandas xlrd openpyxl beautifulsoup4 html5lib lxml

      - name: Descargar y Procesar Grillas TVEGO
        env:
          TAPKIT_EMAIL: ${{ secrets.TAPKIT_EMAIL }}
          TAPKIT_PASSWORD: ${{ secrets.TAPKIT_PASSWORD }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python updater.py
          python updater_discovery.py
          python updater_skydance.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CTOOLA_EPG.xml CNLA_EPG.xml WARNERLA_EPG.xml TNTLA_EPG.xml DKLA_EPG.xml TOONCAST_EPG.xml TNT_SPORTS.xml nickelodeon/Nickelodeon_LA.xml
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en las grillas."
          else
            git commit -m "Auto-update EPG WB + Discovery"
            git push
          fi